version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: '16:07'
      timezone: 'Etc/UTC'
    assignees:
      - vreshch
    open-pull-requests-limit: 10
    ignore:
      # typescript-eslint peer-caps typescript <6.1.0 - drop when it supports 7.x
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      all-npm:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /extensions/components
    # Not chore(deps): prepare-release.yml counts that as a library patch.
    commit-message:
      prefix: 'chore(extension)'
    schedule:
      interval: weekly
      day: friday
      time: '16:07'
      timezone: 'Etc/UTC'
    assignees:
      - vreshch
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      extension-npm:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: '16:07'
      timezone: 'Etc/UTC'
    assignees:
      - vreshch
    open-pull-requests-limit: 5
    groups:
      all-actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: '16:07'
      timezone: 'Etc/UTC'
    assignees:
      - vreshch
    open-pull-requests-limit: 5
    groups:
      all-docker:
        patterns:
          - '*'
